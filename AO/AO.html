<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bape</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-image: url("BapeF.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .mono {
        width: 320px;
        height: auto;
        object-fit: contain;
        animation: respirar 2.8s ease-in-out infinite;
        transform-origin: center;
    }

    @keyframes respirar {
        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.12);
        }

        100% {
            transform: scale(1);
        }
    }
</style>
</head>

<body>

<img src="Bape.png" class="mono">

</body>
</html>
