<!doctype html>
<html lang="es">
 <head>
   <meta charset="utf-8">
   <title>Golden Globe Winners 2020</title>
   <style>
     body {
       background-color: #f4f6f9;
       text-align: center;
       font-family: Arial, sans-serif;
       padding: 40px 20px;
     }

     h1 {
       color: #1a2a3a;
       font-size: 32px;
       margin-bottom: 30px;
       border-bottom: 3px solid #d4af37;
       display: inline-block;
       padding-bottom: 10px;
     }

     .box {
       background-color: #ffffff;
       max-width: 550px;
       margin: 0 auto 20px auto;
       padding: 15px 20px;
       border-radius: 8px;
       box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
       border-left: 5px solid #800000;
     }

     h2 {
       color: #800000;
       font-variant: small-caps;
       font-size: 18px;
       margin-top: 5px;
       margin-bottom: 8px;
     }

     p {
       color: #2c3e50;
       font-size: 26px;
       font-weight: bold;
       margin: 0;
     }
   </style>

 </head>
 <body>

   <h1>Golden Globe Winners 2020</h1>

   <div class="box">
     <h2>Best Motion Picture - Drama</h2>
     <p id="bestdrama">1917</p>
   </div>

   <div class="box">
     <h2>Best Motion Picture - Musical or Comedy</h2>
     <p id="bestcomedy">Once Upon a Time in Hollywood</p>
   </div>

   <div class="box">
     <h2>Best performance by an actress in a motion picture - drama</h2>
     <p id="bestactress">Renée Zellweger</p>
   </div>

   <div class="box">
     <h2>Best performance by an actor in a motion picture - drama</h2>
     <p id="bestactor">Joaquin Phoenix</p>
   </div>

 </body>
</html>
