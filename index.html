<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOFTY Studio™</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f9f7f6;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: #0c0c0c;
  }

  /* Tarjeta contenedora central */
  .menu-card {
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 13px;
    font-weight: 400;
    color: #777777;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 35px;
  }

  /* Contenedor de botones */
  .act-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* Botones estilo minimalista pro */
  .act-link {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border: 1.5px solid #0c0c0c;
    border-radius: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #0c0c0c;
    text-decoration: none;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Efecto Hover moderno */
  .act-link:hover {
    background-color: #0c0c0c;
    color: #f9f7f6;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(12, 12, 12, 0.15);
  }

  .act-link:active {
    transform: translateY(0);
  }
</style>
</head>
<body>

<main class="menu-card">
  <h1>MENU LOFTY Studio™</h1>

  </nav>
</main>

</body>
</html>
