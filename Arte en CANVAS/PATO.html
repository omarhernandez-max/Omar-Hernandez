<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pato Pixel Art</title>

    <style>

        body {
            margin: 0;
            padding: 0;
            background: white;
            overflow: hidden;
        }

        #pato {
            position: absolute;
            left: 0;
            top: 0;

            display: grid;

            grid-template-columns: repeat(7, 25px);
            grid-template-rows: repeat(7, 25px);
        }

        .cuadro {
            width: 25px;
            height: 25px;
        }

        /* COLORES */
        .amarillo {
            background: #FFD900;
        }

        .naranja {
            background: #FF9D00;
        }

        .negro {
            background: #000000;
        }

        .vacio {
            background: transparent;
        }

    </style>
</head>

<body>


    <div id="pato">

        <div class="vacio"></div>
        <div class="vacio"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="vacio"></div>
        <div class="vacio"></div>

        <div class="vacio"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="negro"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="vacio"></div>

        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="naranja"></div>

        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="vacio"></div>

        <div class="vacio"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="vacio"></div>

        <div class="vacio"></div>
        <div class="vacio"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="amarillo"></div>
        <div class="vacio"></div>
        <div class="vacio"></div>

        <div class="naranja"></div>
        <div class="naranja"></div>
        <div class="vacio"></div>
        <div class="vacio"></div>
        <div class="vacio"></div>
        <div class="naranja"></div>
        <div class="naranja"></div>

    </div>



    <script>

        let pato = document.getElementById("pato");

        let x = 100;
        let y = 100;

        let velocidadX = 3;
        let velocidadY = 3;


        function animate() {

            x += velocidadX;
            y += velocidadY;

            pato.style.transform = `translate(${x}px, ${y}px)`;


            if (x <= 0 || x + pato.offsetWidth >= window.innerWidth) {
                velocidadX *= -1;
            }


            if (y <= 0 || y + pato.offsetHeight >= window.innerHeight) {
                velocidadY *= -1;
            }


            requestAnimationFrame(animate);
        }


        animate();

    </script>

</body>
</html>
