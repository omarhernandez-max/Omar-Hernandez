<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LOFTY Bape Studio™</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-image: url("BapeF.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
    }

    header {
      width: 100%;
      padding: 28px 40px;
      text-align: center;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 4px;
      font-weight: 700;
    }

    .subtitulo {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .contenedor {
      margin-top: 35px;
      padding: 18px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      width: 1000px;
      height: 700px;
      max-width: 80vw;
      max-height: 65vh;
      border-radius: 10px;
    }

    footer {
      margin-top: 18px;
      margin-bottom: 20px;
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.55;
    }
  </style>
</head>

<body>

  <header>
    <h1>LOFTY Bape Studio™</h1>
    <div class="subtitulo">Digital Motion Experience</div>
  </header>

  <div class="contenedor">
    <canvas id="canvas" width="1000" height="700"></canvas>
  </div>

  <footer>
    LOFTY STUDIO™
  </footer>

  <script>
    var canvas = document.getElementById("canvas");
    var context = canvas.getContext("2d");

    var bape = new Image();
    var fondo = new Image();

    bape.src = "Bape.png";
    fondo.src = "BapeC.png";

    var x = 400;
    var y = 150;

    var dx = 4;
    var dy = 1.8;

    var anchoOriginal = 200;
    var altoOriginal = 300;

    var escala = 1;
    var crecimiento = 0.003;

    var limiteArriba = 50;
    var limiteAbajo = 350;

    function animar() {
      context.clearRect(0, 0, canvas.width, canvas.height);

      context.drawImage(
        fondo,
        0,
        0,
        canvas.width,
        canvas.height
      );

      var ancho = anchoOriginal * escala;
      var alto = altoOriginal * escala;

      context.drawImage(
        bape,
        x,
        y,
        ancho,
        alto
      );

      x += dx;
      y += dy;

      escala += crecimiento;

      if (escala >= 1.10 || escala <= 0.90) {
        crecimiento = -crecimiento;
      }

      if (x <= 0 || x + ancho >= canvas.width) {
        dx = -dx;
      }

      if (y <= limiteArriba || y + alto >= limiteAbajo) {
        dy = -dy;
      }

      requestAnimationFrame(animar);
    }

    var cargadas = 0;

    bape.onload = function() {
      cargadas++;

      if (cargadas === 2) {
        animar();
      }
    };

    fondo.onload = function() {
      cargadas++;

      if (cargadas === 2) {
        animar();
      }
    };
  </script>

</body>
</html>
